services:
  mongodb:
    image: mongo:latest
    restart: always
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secret
    networks:
      - chatapps
    ports:
      - 27017:27017

  backend:
     build: ./backend
     container_name: chatappbackend
     networks:
       - chatapps
     depends_on:
       - mongodb
     environment:
       - NODE_ENV=production
       - MONGODB_URI=mongodb://mongoadmin:secret@mongodb:27017/dbname?authSource=admin
       - JWT_SECRET=e15b88f2053960cfb734095f7375eca75d50185cee3af7a7
       - PORT=5001

  frontend:
    build:
      context: ./frontend
    container_name: chatappfrontend
    depends_on:
      - backend
    networks:
      - chatapps
    ports:
      - 80:80

volumes:
  mongo-data:

networks:
  chatapps: