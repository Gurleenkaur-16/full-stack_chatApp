apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend_deployment
  namespace: chat-app
  labels:
    apps: frontend
  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend-dev-pod
      labels: 
        app: frontend

    spec:
      containers:
        - name: chatappfrontend
          image: 
          ports:
            - containerPort: 80
          env:
            - name:  NODE_ENV 
              value: production
            