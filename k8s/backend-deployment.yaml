apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend_deployment
  namespace: chat-app
  labels:
    apps: backend
  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend-dev-pod
      labels: 
        app: backend

    spec:
      containers:
        - name: chatappbackend
          image: 
          ports:
            - containerPort: 5001
          env:
            - name:  NODE_ENV 
              value: production
            - name: MONGODB_URI
              value: mongodb://mongoadmin:secret@mongodb:27017/dbname?authSource=admin
            - name: JWT_SECRET
              value: e15b88f2053960cfb734095f7375eca75d50185cee3af7a7
            - name: PORT
              value: "5001"